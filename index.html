<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نموذج التواصل</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="contact-card">
    <h2>تواصل معنا</h2>
    <p>أدخل بياناتك وسنقوم بالرد عليك في أقرب وقت ممكن.</p>

    <form id="contactForm">
      <div class="field-group">
        <label for="name">الاسم الكامل</label>
        <input type="text" id="name" name="name" placeholder="اكتب اسمك هنا" required>
      </div>

      <div class="field-group">
        <label for="email">البريد الإلكتروني</label>
        <input type="email" id="email" name="email" placeholder="example@domain.com" required>
      </div>

      <div class="field-group">
        <label for="subject">الموضوع</label>
        <input type="text" id="subject" name="subject" placeholder="عنوان الرسالة" required>
      </div>

      <div class="field-group">
        <label for="message">الرسالة</label>
        <textarea id="message" name="message" rows="4" placeholder="اكتب رسالتك هنا..." required></textarea>
      </div>

      <button type="submit" id="submitBtn">إرسال الرسالة</button>
      <div id="statusMessage" class="status-msg"></div>
    </form>
  </div>

  <script src="script.js"></script>
</body>
</html>
