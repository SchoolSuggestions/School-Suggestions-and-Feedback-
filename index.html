<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>بوابة الإرشاد الطلابي | تقديم طلب</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
</head>
<body>

  <header class="navbar">
    <div class="nav-container">
      <div class="brand">
        <span class="brand-icon">🎓</span>
        <span class="brand-text">وحدة الإرشاد الطلابي</span>
      </div>
      <a href="supervisor.html" class="nav-link">لوحة المشرفة الطلابية ←</a>
    </div>
  </header>

  <main class="container">
    <section class="form-wrapper">
      <div class="form-header">
        <h1>تواصل مع المشرفة الطلابية</h1>
        <p>نحن هنا لدعمك أكاديمياً ونفسياً. يمكنك إرسال استفسارك أو طلبك وستتم معالجته بسرية تامة.</p>
      </div>

      <form id="contactForm">
        <div class="form-row">
          <div class="field-group">
            <label for="name">الاسم الكامل</label>
            <input type="text" id="name" name="name" placeholder="أدخلي اسمك الكامل" required>
          </div>
          <div class="field-group">
            <label for="email">البريد الإلكتروني / الجامعي</label>
            <input type="email" id="email" name="email" placeholder="student@kau.edu.sa" required>
          </div>
        </div>

        <div class="form-row">
          <div class="field-group">
            <label for="category">نوع الاستشارة</label>
            <select id="category" name="category" required>
              <option value="" disabled selected>إختاري تصنيف الطلب</option>
              <option value="إرشاد أكاديمي">إرشاد أكاديمي</option>
              <option value="دعم نفسي واجتماعي">دعم نفسي واجتماعي</option>
              <option value="استفسار عام">استفسار عام</option>
              <option value="شكوى أو اقتراح">شكوى أو اقتراح</option>
            </select>
          </div>
          <div class="field-group">
            <label for="subject">عنوان الموضوع</label>
            <input type="text" id="subject" name="subject" placeholder="موضوع الرسالة اختصاراً" required>
          </div>
        </div>

        <div class="field-group">
          <label for="message">تفاصيل الرسالة</label>
          <textarea id="message" name="message" rows="5" placeholder="اكتبي تفاصيل طلبك هنا..." required></textarea>
        </div>

        <button type="submit" id="submitBtn" class="btn-primary">
          <span class="btn-text">إرسال الطلب للمشرفة</span>
          <span class="spinner hidden"></span>
        </button>

        <div id="statusMessage" class="status-box hidden"></div>
      </form>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
