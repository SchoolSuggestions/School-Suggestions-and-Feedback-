<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة تحكم المشرفة الطلابية</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
</head>
<body>

  <header class="navbar supervisor-nav">
    <div class="nav-container">
      <div class="brand">
        <span class="brand-icon">📋</span>
        <span class="brand-text">لوحة تحكم المشرفة الطلابية</span>
      </div>
      <a href="index.html" class="nav-link">← صفحة الطلاب</a>
    </div>
  </header>

  <main class="container dashboard-container">
    
    <section class="stats-grid">
      <div class="stat-card">
        <div class="stat-title">إجمالي الاستشارات</div>
        <div class="stat-value" id="totalRequests">0</div>
      </div>
      <div class="stat-card alert">
        <div class="stat-title">قيد المراجعة</div>
        <div class="stat-value" id="pendingRequests">0</div>
      </div>
      <div class="stat-card success">
        <div class="stat-title">تمت المعالجة</div>
        <div class="stat-value" id="completedRequests">0</div>
      </div>
    </section>

    <section class="table-card">
      <div class="table-header">
        <h2>قائمة الاستشارات والطلبات الواردة</h2>
        <div class="filter-box">
          <input type="text" id="searchInput" placeholder="بحث باسم الطالبة أو الموضوع...">
          <button id="refreshBtn" class="btn-secondary">تحديث البيانات 🔄</button>
        </div>
      </div>

      <div class="table-responsive">
        <table class="custom-table">
          <thead>
            <tr>
              <th>رقم الطلب</th>
              <th>التاريخ</th>
              <th>اسم الطالبة</th>
              <th>البريد الإلكتروني</th>
              <th>التصنيف</th>
              <th>الموضوع</th>
              <th>الرسالة</th>
              <th>الحالة</th>
            </tr>
          </thead>
          <tbody id="supervisorTableBody">
            <tr>
              <td colspan="8" class="text-center loading-td">جاري تحميل البيانات...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>

  </main>

  <script src="supervisor.js"></script>
</body>
</html>
